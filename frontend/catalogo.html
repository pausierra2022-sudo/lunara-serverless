<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Catálogo | Lunara</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<link rel="stylesheet" href="css/styles.css">

</head>

<body>

<!-- MENU -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">

    <div class="container">

        <a class="navbar-brand" href="index.html">

            🌙 LUNARA

        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="menu">

            <span
                id="usuario"
                class="text-white me-3">
            </span>

            <a
                id="btnLogout"
                class="nav-link text-warning me-3"
                href="#">

                Cerrar Sesión

            </a>

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">Inicio</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="catalogo.html">Catálogo</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="nosotros.html">Quiénes Somos</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="contacto.html">
                        Contacto
                    </a>
                </li>

                <li class="nav-item">

                    <a id="btnRegistro"
                       class="nav-link"
                       href="registro.html">

                        Registro

                    </a>

                </li>

                <li class="nav-item">

                    <a id="btnLogin"
                       class="nav-link"
                       href="login.html">

                        Iniciar Sesión

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       href="carrito.html">

                        🛒 Carrito

                        <span id="contadorCarrito"></span>

                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>

<!-- TITULO -->

<section class="container py-5">

    <h1 class="text-center mb-4">

        Catálogo Lunara

    </h1>

    <!-- BUSQUEDA -->

    <div class="row mb-3">

        <div class="col-md-3">

            <input
                type="text"
                id="buscar"
                class="form-control"
                placeholder="Buscar por nombre">

        </div>

        <div class="col-md-3">

            <select
                id="categoria"
                class="form-select">

                <option value="">Todas las categorías</option>
                <option value="Vestidos">Vestidos</option>
                <option value="Blusas">Blusas</option>
                <option value="Jeans">Jeans</option>
                <option value="Faldas">Faldas</option>
                <option value="Chaquetas">Chaquetas</option>

            </select>

        </div>

        <div class="col-md-2">

            <select
                id="talla"
                class="form-select">

                <option value="">Todas las tallas</option>
                <option value="S">S</option>
                <option value="M">M</option>
                <option value="L">L</option>

            </select>

        </div>

        <div class="col-md-2">

            <input
                type="number"
                id="precioMax"
                class="form-control"
                placeholder="Precio máximo">

        </div>

        <div class="col-md-2">

            <button
                class="btn btn-lunara w-100"
                onclick="filtrarProductos()">

                Buscar

            </button>

        </div>

    </div>

    <!-- PRODUCTOS -->

    <div
        class="row"
        id="contenedorProductos">

    </div>

</section>
<script>

const API_URL =
"https://obtenerproductos-zyurdt3cka-uc.a.run.app";

let productos = [];

const contenedor =
document.getElementById("contenedorProductos");

/* ===========================
   CARGAR PRODUCTOS DESDE FIREBASE
=========================== */

async function cargarProductos() {

    try {

        const respuesta = await fetch(API_URL);

        if (!respuesta.ok) {

            throw new Error("Error al consultar la API");

        }

        productos = await respuesta.json();

        console.log("Productos recibidos:", productos);
        console.log("Cantidad:", productos.length);

        mostrarProductos(productos);

    } catch (error) {

        console.error("ERROR:", error);

        Swal.fire({

            icon: "error",
            title: "Error",
            text: "No fue posible cargar el catálogo."

        });

    }

}

/* ===========================
   MOSTRAR PRODUCTOS
=========================== */

function mostrarProductos(lista) {

    contenedor.innerHTML = "";

    if (lista.length === 0) {

        contenedor.innerHTML = `

            <div class="col-12">

                <div class="alert alert-warning text-center">

                    No se encontraron productos.

                </div>

            </div>

        `;

        return;

    }
    lista.forEach(producto => {

        contenedor.innerHTML += `

        <div class="col-md-4 mb-4">

            <div class="card h-100 shadow-sm">

                <img
                    src="${producto.imagen}"
                    class="card-img-top"
                    alt="${producto.nombre}">

                <div class="card-body d-flex flex-column">

                    <h5 class="card-title">

                        ${producto.nombre}

                    </h5>

                    <p class="card-text">

                        ${producto.descripcion}

                    </p>

                    <p>

                        <strong>Categoría:</strong> ${producto.categoria}

                    </p>

                    <p>

                        <strong>Talla:</strong> ${producto.talla}

                    </p>

                    <p>

                        <strong>Stock:</strong> ${producto.stock}

                    </p>

                    <h5 class="text-primary">

                        $${Number(producto.precio).toLocaleString("es-CO")}

                    </h5>

                    <button
                        class="btn btn-lunara mt-auto"
                        onclick="agregarCarrito('${producto.id}')">

                        Agregar al carrito

                    </button>

                </div>

            </div>

        </div>

        `;

    });

}
/* ===========================
   FILTRAR PRODUCTOS
=========================== */

function filtrarProductos() {

    const texto = document
        .getElementById("buscar")
        .value
        .toLowerCase()
        .trim();

    const categoria = document
        .getElementById("categoria")
        .value;

    const talla = document
        .getElementById("talla")
        .value;

    const precioTexto = document
    .getElementById("precioMax")
    .value
    .trim();

const precioMax =
    precioTexto === ""
        ? null
        : Number(precioTexto);
    
    const filtrados = productos.filter(producto => {

        const coincideNombre =
            producto.nombre.toLowerCase().includes(texto);

        const coincideCategoria =
            categoria === "" ||
            producto.categoria === categoria;

        const coincideTalla =
            talla === "" ||
            producto.talla === talla;

        const coincidePrecio =
            precioMax === null ||
            producto.precio <= precioMax;

        return (
            coincideNombre &&
            coincideCategoria &&
            coincideTalla &&
            coincidePrecio
        );

    });

    mostrarProductos(filtrados);

}

/* ===========================
   CARRITO
=========================== */

function agregarCarrito(idProducto) {

    let carrito = JSON.parse(localStorage.getItem("carrito")) || [];

    const producto = productos.find(p => String(p.id) === String(idProducto));

    if (!producto) {

        Swal.fire({

            icon: "error",
            title: "Producto no encontrado"

        });

        return;

    }

    const existente = carrito.find(item => String(item.id) === String(idProducto));

    if (existente) {

        existente.cantidad++;

    } else {

        carrito.push({

            id: producto.id,
            nombre: producto.nombre,
            precio: producto.precio,
            imagen: producto.imagen,
            cantidad: 1

        });

    }

    localStorage.setItem("carrito", JSON.stringify(carrito));

    actualizarContadorCarrito();

    Swal.fire({

        icon: "success",
        title: "Producto agregado",

        timer: 1200,

        showConfirmButton: false

    });

}

/* ===========================
   CONTADOR CARRITO
=========================== */

function actualizarContadorCarrito() {

    const carrito = JSON.parse(localStorage.getItem("carrito")) || [];

    const total = carrito.reduce((suma, item) => suma + item.cantidad, 0);

    const contador = document.getElementById("contadorCarrito");

    if (contador) {

        contador.textContent = total > 0 ? `(${total})` : "";

    }

}

/* ===========================
   SESIÓN DE USUARIO
=========================== */

const usuario = JSON.parse(localStorage.getItem("usuario"));

const spanUsuario = document.getElementById("usuario");
const btnLogin = document.getElementById("btnLogin");
const btnRegistro = document.getElementById("btnRegistro");
const btnLogout = document.getElementById("btnLogout");

if (usuario) {

    spanUsuario.textContent = `Bienvenido, ${usuario.nombre}`;

    btnLogin.style.display = "none";
    btnRegistro.style.display = "none";
    btnLogout.style.display = "block";

} else {

    spanUsuario.textContent = "";

    btnLogin.style.display = "block";
    btnRegistro.style.display = "block";
    btnLogout.style.display = "none";

}

btnLogout.addEventListener("click", function (e) {

    e.preventDefault();

    localStorage.removeItem("usuario");

    Swal.fire({

        icon: "success",
        title: "Sesión cerrada",

        timer: 1200,

        showConfirmButton: false

    }).then(() => {

        window.location.href = "index.html";

    });

});

/* ===========================
   INICIALIZACIÓN
=========================== */

actualizarContadorCarrito();

cargarProductos();

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
