<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contacto | Lunara</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">

</head>

<body>

<div class="container py-5">

<div class="text-center mb-5">

    <h1 class="page-title">
        🌙 LUNARA
    </h1>

    <h3 class="mt-3">
        Contáctanos
    </h3>

    <p class="text-muted">
        Diseños que reflejan tu esencia
    </p>

</div>


<img
src="img/contacto/contactanos.jpg"
class="banner-contacto shadow mb-5">

<p><strong>Dirección:</strong> Bogotá D.C., Colombia</p>

<p><strong>Teléfono:</strong> (+57) 300 123 4567</p>

<p><strong>Email:</strong> contacto@lunara.com</p>

<hr>

<form>

<div class="mb-3">
<label>Nombre</label>
<input type="text" class="form-control">
</div>

<div class="mb-3">
<label>Correo</label>
<input type="email" class="form-control">
</div>

<div class="mb-3">
<label>Mensaje</label>
<textarea class="form-control" rows="4"></textarea>
</div>

<button
type="button"
class="btn btn-lunara"
onclick="enviarMensaje()">

Enviar

</button>

</form>

</div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>

function enviarMensaje(){

Swal.fire({

    icon:'success',

    title:'¡Mensaje recibido!',

    html:`
        
        Pronto nos comunicaremos contigo.<br><br>
        Gracias por contactar a <strong>LUNARA</strong> 🌙
    `,

    confirmButtonColor:'#C89B3C',
    confirmButtonText:'Volver al inicio',

}).then(() => {

    window.location.href = "index.html";

});

}

</script>
</body>
</html>
